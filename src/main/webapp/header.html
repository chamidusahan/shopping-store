<style>
    header {
        background: white;
        padding: 20px 0;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
    }

    header nav {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
    }

    .logo-container {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .logo {
        width: 45px;
        height: 45px;
        background: #2d2d2d;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: white;
    }

    .brand-name {
        font-family: 'Montserrat', sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #2d2d2d;
    }

    .nav-links {
        display: flex;
        gap: 28px;
        list-style: none;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    .nav-links a {
        text-decoration: none;
        color: #666;
        font-weight: 500;
        font-size: 15px;
        transition: color 0.3s;
        padding: 6px 0;
    }

    .nav-links a:hover {
        color: #2d2d2d;
    }

    .nav-actions {
        position: relative;
        display: flex;
        align-items: center;
        margin-left: 30px;
    }

    .nav-toggle {
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 5px;
        width: 44px;
        height: 44px;
        border: 2px solid #2d2d2d;
        border-radius: 10px;
        background: white;
        cursor: pointer;
        transition: background 0.3s, border-color 0.3s;
    }

    nav.nav-open .nav-toggle {
        background: #f5f5f5;
    }

    .nav-toggle:hover {
        background: #f5f5f5;
    }

    .nav-toggle-bar {
        width: 22px;
        height: 2px;
        background: #2d2d2d;
        transition: transform 0.3s, opacity 0.3s;
    }

    nav.nav-open .nav-toggle-bar:nth-child(1) {
        transform: translateY(6px) rotate(45deg);
    }

    nav.nav-open .nav-toggle-bar:nth-child(2) {
        opacity: 0;
    }

    nav.nav-open .nav-toggle-bar:nth-child(3) {
        transform: translateY(-6px) rotate(-45deg);
    }

    .account-toggle {
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        border: 2px solid #2d2d2d;
        background: transparent;
        color: #2d2d2d;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .account-toggle:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(45, 45, 45, 0.2);
    }

    .account-menu {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        background: white;
        border-radius: 12px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        border: 1px solid #eee;
        list-style: none;
        padding: 12px 0;
        min-width: 200px;
        display: none;
        z-index: 50;
    }

    .nav-actions.open .account-menu {
        display: block;
    }

    .account-menu li a {
        display: block;
        padding: 10px 20px;
        color: #666;
        text-decoration: none;
        font-size: 14px;
        transition: background 0.2s, color 0.2s;
    }

    .account-menu li a:hover {
        background: #f5f5f5;
        color: #2d2d2d;
    }

    .account-menu li a.logout {
        color: #d23c3c;
    }

    .account-menu li a.logout:hover {
        background: rgba(210, 60, 60, 0.1);
        color: #b12525;
    }

    @media (max-width: 768px) {
        header nav {
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
        }

        .nav-toggle {
            display: flex;
            align-self: flex-end;
        }

        .nav-links {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 12px;
        }

        nav.nav-open #primaryNav {
            display: flex;
        }

        .nav-links li {
            width: 100%;
        }

        .nav-links a {
            display: block;
            padding: 14px 16px;
            background: white;
            border: 1px solid #e4e4e4;
            border-radius: 12px;
        }

        .nav-actions {
            width: 100%;
            margin-left: 0;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
        }

        .account-toggle {
            width: 100%;
            justify-content: space-between;
        }

        .account-menu {
            position: static;
            box-shadow: none;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            margin-top: 12px;
        }

        .brand-name {
            font-size: 20px;
        }

        .logo {
            width: 40px;
            height: 40px;
            font-size: 20px;
        }
    }
</style>
<header>
    <nav>
        <div class="logo-container">
            <div class="logo"><i class="fas fa-shopping-bag"></i></div>
            <span class="brand-name">Shopping Store</span>
        </div>
        <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="primaryNav" aria-label="Toggle navigation">
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
        </button>
        <ul class="nav-links" id="primaryNav">
            <li><a href="index.html">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="#">About</a></li>
        </ul>
        <div class="nav-actions" id="accountMenuWrapper">
            <button class="account-toggle" id="accountToggle" aria-expanded="false">
                <i class="fas fa-user"></i>
                Account
                <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <ul class="account-menu" id="accountMenu">
                <li><a href="my-account.html" data-menu="account" style="display:none;">My Account</a></li>
                <li><a href="admin-dashboard.html" data-menu="admin" style="display:none;">Admin Dashboard</a></li>
                <li><a href="sign-up.html" data-menu="signup">Sign Up</a></li>
                <li><a href="sign-in.html" data-menu="signin">Sign In</a></li>
                <li><a href="#" data-menu="history">History</a></li>
                <li><a href="#" class="logout" data-menu="logout" style="display:none;">Log Out</a></li>
            </ul>
        </div>
    </nav>
</header>
