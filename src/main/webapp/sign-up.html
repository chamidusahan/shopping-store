<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Shopping Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            overflow: hidden;
            min-height: 650px;
        }

        /* Left Side - Form */
        .form-section {
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-title {
            font-size: 42px;
            color: #2d2d2d;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .form-subtitle {
            font-size: 42px;
            color: #2d2d2d;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-btn {
            padding: 14px 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .social-btn:hover {
            border-color: #333;
            background: #fafafa;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            font-size: 13px;
            color: #999;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .f {
            display: flex;
            gap: 15px;
        }

        .field {
            flex: 1;
        }

        .field input {
            width: 100%;
        }

        label {
            display: block;
            font-size: 13px;
            color: #666;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            outline: none;
            background: #fafafa;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #333;
            background: white;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2d2d2d;
            margin-top: 2px;
        }

        .checkbox-group label {
            font-size: 13px;
            color: #666;
            cursor: pointer;
            margin-bottom: 0;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 400;
            line-height: 1.5;
        }

        .checkbox-group label span {
            color: #2d2d2d;
            font-weight: 600;
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #2d2d2d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .submit-btn:hover {
            background: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .signin-link {
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .signin-link a {
            color: #2d2d2d;
            font-weight: 600;
            text-decoration: underline;
        }

        .signin-link a:hover {
            color: #000;
        }

        /* Right Side - Image */
        .image-section {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            position: relative;
            overflow: hidden;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .image-section {
                display: none;
            }

            .form-section {
                padding: 50px 40px;
            }
        }

        @media (max-width: 480px) {
            .form-section {
                padding: 40px 30px;
            }

            .form-title,
            .form-subtitle {
                font-size: 32px;
            }

            .social-buttons {
                grid-template-columns: 1fr;
            }

            .f {
                flex-direction: column;
                gap: 18px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">

    <!-- Left Side - Form -->
    <div class="form-section">

        <h2 class="form-title">Create</h2>
        <h2 class="form-subtitle">Account</h2>




        <!-- Form -->
        <form>
            <!-- First Name & Last Name -->
            <div class="form-group">
                <div class="f">
                    <div class="field">
                        <label for="firstname">First Name</label>
                        <input type="text" id="firstname" placeholder="Sahan">
                    </div>
                    <div class="field">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname" placeholder="Fernando">
                    </div>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <!-- Terms Checkbox -->
            <div class="checkbox-group">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the <span>Terms & Conditions</span></label>
            </div>

            <!-- Submit Button -->
            <button type="button" onclick="signUp()" class="submit-btn">Create Account</button>

            <!-- Sign In Link -->
            <p class="signin-link">
                ALREADY HAVE AN ACCOUNT? <a href="sign-in.html">SIGN IN</a>
            </p>

        </form>

    </div>

    <!-- Right Side - Image -->
    <div class="image-section">
        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=420&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Fashion Model">
    </div>

</div>

<script src="assets/js/sign-up.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
